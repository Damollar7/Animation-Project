<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat and Mouse</title><link rel="stylesheet" href="cat-mouse.css"></head>
<body><h2>Cat and Mouse</h2>
<div class="stage floor">
  <div id="cat">
    <div class="tail"></div>
    <div class="cat-body"></div>
    <div id="head">
      <div class="ear l"></div><div class="ear r"></div>
      <div class="eye l"><div class="pupil"></div></div>
      <div class="eye r"><div class="pupil"></div></div>
      <div class="nose"></div>
    </div>
  </div>
  <div class="mouse" id="mouse"></div>
</div>
<p>The mouse runs round the cat. The cat keeps watching it.</p>
<script src="cat-mouse.js"></script></body></html>
