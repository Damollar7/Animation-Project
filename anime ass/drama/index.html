<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Summit</title>
  <link rel="stylesheet" href="drama.css">
</head>
<body>
  <h2>Handicap Drama</h2>
  <div id="stage">
    <div class="mountain"></div>
    <div class="ground"></div>

    <!-- me, using my own photo, on one leg and a crutch -->
    <div class="person" id="me">
      <img src="me.png" alt="me">
      <div class="crutch"></div>
    </div>

    <!-- the doubter -->
    <div class="person" id="foe">
      <div class="coat"></div>
      <div class="foe-head"><b></b><b></b></div>
    </div>

    <div id="bubble"></div>
    <div id="flash"></div>
  </div>
  <button id="replay">Replay</button>
  <script src="script.js"></script>
</body>
</html>
